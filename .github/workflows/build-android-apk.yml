name: Build Open City 3D APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install JavaScript transpiler
        working-directory: android
        run: npm install --no-audit --no-fund
      - name: Prepare game for older Android WebView
        working-directory: android
        run: node scripts/prepare.js
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.4'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Open-City-3D-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable GitHub release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: Open City 3D APK build ${{ github.run_number }}
          make_latest: true
          files: android/app/build/outputs/apk/debug/app-debug.apk
          body: |
            Debug APK for the Open City 3D prototype.
            Internet is required to load the Three.js library.
            Android 4.0.4 compatibility is not confirmed on physical hardware.
